services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack-autoremediation
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,ec2,lambda,events,iam,sts
      - AWS_DEFAULT_REGION=us-east-1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  autoremediation-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: serverless-cloud-autoremediation-engine
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    command: ["python", "-m", "pytest", "tests/", "-v"]
