groups:
  - name: serverless_autoremediation_alerts
    rules:
      - alert: RemediationDLQDepthSpike
        expr: aws_sqs_approximate_number_of_messages_visible{queue_name="remediation-dlq"} > 0
        for: 5m
        labels:
          severity: critical
          tier: security
        annotations:
          summary: "Remediation findings in SQS Dead Letter Queue"
          description: "One or more security findings could not be automatically remediated. Inspect DLQ payload."

      - alert: RemediationLambdaErrorSpike
        expr: sum(rate(aws_lambda_errors_total{function_name=~"remediation-.*"}[5m])) > 0.1
        for: 2m
        labels:
          severity: warning
          tier: serverless
        annotations:
          summary: "Spike in remediation Lambda execution errors"
          description: "Remediation handler encountering unhandled exceptions."
